site_name: Cyvest
site_description: Build, score, and narrate cybersecurity investigations with confidence.
site_url: https://pakitosec.github.io/cyvest/
repo_url: https://github.com/PakitoSec/cyvest
repo_name: PakitoSec/cyvest
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
  palette:
    - scheme: default
      primary: blue
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PakitoSec/cyvest
      name: Cyvest on GitHub
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/pakitosec
      name: PakitoSec on Twitter

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Concepts: getting-started/concepts.md
  - Migration:
      - Version 6.x to 7.0: migration-v6-to-v7.md
      - Version 5.x to 6.0: migration-v5-to-v6.md
  - Scoring Model: scoring-model.md
  - Timeline: timeline.md
  - External Signals: external-signals.md
  - Shared Investigation Context: shared-investigation-context.md
  - Comparing Investigations: comparing-investigations.md
  - Observable Extraction: observable-extraction.md
  - JavaScript Packages: js-packages.md
  - Contributing: contributing.md
  - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - tables
  - def_list
  - codehilite
