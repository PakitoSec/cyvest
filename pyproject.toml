[project]
name = "cyvest"
version = "7.2.0"
description = "Cybersecurity investigation model"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "PakitoSec", email = "jeromep83@gmail.com" }
]
dependencies = [
    "click>=8",
    "logurich[click]>=1.0.0",
    "pydantic>=2.12.5",
    "rich>=13",
    "typing-extensions>=4.15",
]
keywords = ["cybersecurity", "investigation", "threat-intel", "security-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.optional-dependencies]
langchain = ["langchain>=1.0"]

[project.scripts]
cyvest = "cyvest.cli:main"

[project.urls]
Homepage = "https://github.com/PakitoSec/cyvest"
Documentation = "https://pakitosec.github.io/cyvest/"
Repository = "https://github.com/PakitoSec/cyvest"
Issues = "https://github.com/PakitoSec/cyvest/issues"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.1,<0.13.0"

[dependency-groups]
dev = [
    "debugpy>=1.8.17",
    "jsonschema>=4.23.0",
    "langchain>=1.0",
    "pre-commit>=4.4.0",
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.6",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.39",
    "pymdown-extensions>=10.11",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["cyvest"]

# Ruff >= 0.16 formats fenced code blocks in Markdown, which collapses the multi-line fluent
# chains the docs use to teach the API. Prose is out of scope for the formatter.
[tool.ruff.format]
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
